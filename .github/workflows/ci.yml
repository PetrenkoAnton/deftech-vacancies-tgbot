name: CI

on:
  push:
    branches: [ dev_github_actions, main, dev_auto_send_to_group ]
  pull_request:
    branches: [ main, dev_auto_send_to_group ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: go test -v ./...

    - name: Build
      run: go build -o bin/deftech-tgbot .

    - name: Verify build
      run: |
        ls -la bin/
        file bin/deftech-tgbot

    - name: Check if binary is executable
      run: |
        if [ -x "bin/deftech-tgbot" ]; then
          echo "✅ Binary is executable"
        else
          echo "❌ Binary is not executable"
          exit 1
        fi